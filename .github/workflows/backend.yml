name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      # Offline only: tests use fakes and skip anything needing Ollama.
      ENVIRONMENT: test
      OLLAMA_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Format
        run: python -m ruff format --check app tests evals

      - name: Lint
        run: python -m ruff check app tests evals

      - name: Type check
        run: python -m mypy app evals tests

      - name: Tests and coverage
        run: python -m pytest --cov --cov-report=term --cov-fail-under=85

      - name: Offline AI evaluation
        run: python -m evals --json eval-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: backend/eval-report.json
          if-no-files-found: ignore
